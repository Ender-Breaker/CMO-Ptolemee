<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Archives de la Division PTOLÉMÉE — accès membre GOC.">
	<title>Archives · PTOLÉMÉE</title>
	<link rel="icon" href="assets/ptolemee-bleu.png">
	<link rel="stylesheet" href="style.css">
	<script>(function(){try{var t=localStorage.getItem('pref::theme');if(t==='sombre'||t==='clair')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
	<header class="site-header" data-header></header>

	<main>
		<div class="wrap page-head">
			<span class="eyebrow">Accès membre GOC</span>
			<h1>Archives</h1>
			<p>L'intégralité des dossiers de la division.</p>
			<p class="dim mono" style="font-size:.76rem">Certaines entrées ne se relisent pas deux fois de la même manière.</p>
		</div>

		<div class="wrap">
			<div data-announcements></div>
			<div class="lab-bar" data-bar></div>
			<div data-events></div>

			<div data-tree="complet"></div>
		</div>
	</main>

	<footer class="site-footer" data-footer></footer>

	<script src="js/firebase-config.js"></script>
	<script src="js/core.js"></script>
	<script src="js/icons.js"></script>
	<script src="js/research.js"></script>
	<script src="js/graph.js"></script>
	<script src="js/ops.js"></script>
	<script src="js/remote.js"></script>
	<script>
		GOC.ready(function () {
			if (!GOC.Auth.require('membre')) {
				document.querySelector('[data-tree]').removeAttribute('data-tree');
			}
			GOC.UI.boot();
		});
	</script>
	<script src="js/page-tree.js"></script>
</body>
</html>
